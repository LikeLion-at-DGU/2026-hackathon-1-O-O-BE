# O&O 백엔드 nginx 설정
#
# 배치: /etc/nginx/sites-available/oando  →  sites-enabled에 심볼릭 링크
# SERVER_NAME 부분은 실제 값으로 바꾼다. 예) 1-2-3-4.sslip.io
#
# 이 파일은 certbot이 443 블록을 자동으로 추가하기 전 상태다.
# `certbot --nginx -d <도메인>`을 실행하면 certbot이 아래 server 블록을 수정해
# 443 리스너와 인증서 경로를 넣고, 80은 리다이렉트로 바꾼다.

upstream oando {
    server 127.0.0.1:8000;
}

server {
    listen 80;
    server_name SERVER_NAME;

    # 상품 이미지 업로드. 기본값 1M이면 admin에서 사진 올릴 때 413이 난다.
    client_max_body_size 20M;

    # collectstatic 결과. django-admin의 CSS/JS가 여기서 나온다.
    location /static/ {
        alias /srv/oando/staticfiles/;
        access_log off;
        expires 7d;
    }

    # 상품 이미지. DEBUG=False에서는 Django가 미디어를 서빙하지 않는다.
    location /media/ {
        alias /srv/oando/media/;
        access_log off;
        expires 7d;
    }

    location / {
        proxy_pass http://oando;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # 이 헤더가 있어야 Django가 SECURE_PROXY_SSL_HEADER로 https를 인식한다.
        proxy_set_header X-Forwarded-Proto $scheme;

        # --- 챗봇 SSE 스트리밍에 필요한 설정. 지우면 스트리밍이 죽는다. ---
        # 버퍼링이 켜져 있으면 nginx가 응답을 다 모았다가 한 번에 내보내서
        # 사용자는 답변이 끝날 때까지 빈 화면을 본다.
        proxy_buffering off;
        proxy_cache off;
        # 기본 60초로는 LLM 응답이 긴 경우 중간에 끊긴다.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
