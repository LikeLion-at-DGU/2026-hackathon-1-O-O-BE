# 가비아 클라우드 서버 1대(2vCore/4GB)에 전부 올린다.
# AWS 배포 문서의 ALB·RDS·ElastiCache는 이 환경에 없으므로 컨테이너로 대체한다.
services:
  caddy:
    image: caddy:2-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data      # 발급받은 인증서. 이걸 지우면 재발급 한도에 걸릴 수 있다
      - caddy_config:/config
    depends_on:
      - web

  web:
    build: .
    restart: always
    env_file: .env
    volumes:
      - media:/app/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # web이 DB보다 먼저 떠서 죽는 것을 막는다
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: always
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:
  media:
  caddy_data:
  caddy_config:
